# TigerAI Advanced RAG — Community Edition (image-only distribution)
# Runs the 3 app services on top of an existing OpenGenie AI Stack.
#   STACK_NETWORK         = your OpenGenie Docker network name (external)
#   RAG_FILES_PATH        = host path of the shared RAG files dir (same one FileBrowser/n8n use)
#   TIGERAI_IMAGE_PREFIX  = image registry/namespace (default ghcr.io/tigerai-taiwan)
services:
  # nginx 不加 tigerai- 前綴:base 是 upstream nginx:alpine,我們只塞 config 進去。
  # image 名留 tigerai-rag-nginx 是因為要區分自家 build 的 image。
  nginx:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-nginx:latest
    container_name: nginx
    ports:
      - "${HOST_UI_PORT:-8088}:80"
    # v2026-05-30: load .env so the upstream HOST/PORT vars (FB_/N8N_/QDRANT_/
    # OWUI_/DOCLING_) reach the nginx:alpine entrypoint, which runs envsubst
    # on /etc/nginx/templates/default.conf.template at boot. Dockerfile sets
    # safe defaults for the OpenGenie default container names — overrides via
    # .env only if your stack uses different names.
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Taipei
    # add nginx worker to gid=1000 group so it can read the RAG files (640/750) written by n8n
    command:
      - sh
      - -c
      # v1.0.10 fix: exec /docker-entrypoint.sh nginx (NOT exec nginx) so the
      # entrypoint's init scripts run — especially 20-envsubst-on-templates.sh
      # which processes /etc/nginx/templates/*.template. Without this, nginx
      # starts with NO config in conf.d/ → all proxy paths return 404 HTML →
      # UI's JSON.parse on /backend/health fails with "unexpected character".
      - 'G=$$(awk -F: ''$$3==1000{print $$1; exit}'' /etc/group); [ -z "$$G" ] && addgroup -g 1000 nginxfiles && G=nginxfiles; addgroup nginx "$$G" 2>/dev/null; exec /docker-entrypoint.sh nginx -g ''daemon off;'''
    volumes:
      # v1.0.13: mount RAG_FILES_PATH/RAG (not RAG_FILES_PATH itself) — splitter /resolve 回的
      # rel_path 是相對 /srv/RAG (FILES_ROOT) 算出來,不含 RAG/ 前綴。所以 nginx 這邊也要直接掛
      # RAG/ 才能拼得起來。否則 /files/{folder_id}/file → /usr/share/nginx/files/{folder_id}/file
      # 但檔案實際在 host RAG_FILES_PATH/RAG/{folder_id}/file → 404。
      - ${RAG_FILES_PATH:-./data/rag}/RAG:/usr/share/nginx/files:ro
    networks:
      - stack
    depends_on:
      - tigerai-backend
    # v1.0.15 2026-05-31: healthcheck so `docker compose ps` / orchestrators
    # can tell when nginx is actually serving (not just process-up).
    # v1.0.20 2026-06-01: 用 -O /dev/null 取代 --spider(busybox wget --spider 對有 body
    # 的回應會誤判 → 假 unhealthy)。nginx:alpine 有 wget。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tigerai-backend:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-backend:latest
    container_name: tigerai-backend
    expose:
      - "3060"
    environment:
      - TZ=Asia/Taipei
      # v1.0.15 2026-05-31: edition passthrough (community / webapp / advanced)
      # so backend can gate features by edition at runtime.
      - TIGERAI_EDITION=${TIGERAI_EDITION:-community}
    env_file:
      - ./.env
    networks:
      - stack
    # v1.0.15 2026-05-31: healthcheck against /health endpoint.
    # v1.0.20: -O /dev/null(node:alpine 有 wget,但 --spider 同樣 flaky)。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3060/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tigerai-splitter:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-splitter:latest
    container_name: tigerai-splitter
    environment:
      - TZ=Asia/Taipei
    # v1.0.15 2026-05-31: align with nginx/backend — load .env so splitter
    # picks up shared config (paths, tokens, callback URLs).
    env_file:
      - ./.env
    expose:
      - "8000"
    volumes:
      # MUST point at the same dir as FileBrowser/n8n, or Step0-split files won't be visible
      - ${RAG_FILES_PATH:-./data/rag}:/srv
    # v2026-05-31: auto-create RAG/ self-loop symlink so n8n workflow #01's
    # path `/home/node/.n8n-files/RAG/{folder_id}/...` resolves to the same
    # files FileBrowser writes at `{folder_id}/...`. v1.0.9 priority flip:
    # prefer REAL directory (cleaner, no symlink education cost), fallback to
    # self-loop symlink only if mkdir fails (read-only volume / perms).
    # Skips entirely if /srv/RAG already exists.
    command:
      - sh
      - -c
      - 'if [ ! -e /srv/RAG ]; then mkdir /srv/RAG 2>/dev/null && echo "[startup] created /srv/RAG/ (real dir)" || (ln -s . /srv/RAG && echo "[startup] created /srv/RAG -> . symlink (fallback)"); fi; exec uvicorn main:app --host 0.0.0.0 --port 8000'
    networks:
      - stack
    # v1.0.15 2026-05-31: healthcheck via FastAPI /health.
    # v1.0.20 2026-06-01 fix: splitter image 是 python:slim,**沒有 wget**(舊 healthcheck
    # 用 wget → 永遠 unhealthy,假紅燈 + 卡住 depends_on: service_healthy 的 filebrowser)。
    # 改用 python 內建 urllib(image 一定有 python)。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # v1.0.11: 把 FileBrowser bundle 進來(OpenGenie 預設不含,Tab 02 上傳功能必要)。
  # 不加 tigerai- 前綴:這不是我方產品,是 upstream filebrowser/filebrowser image。
  # --noauth 內部 docker network only,對外經 nginx /api/ proxy 走我方 auth。
  #
  # v1.0.15 2026-05-31 (修 Gemini 坑一): filebrowser/filebrowser:latest 是 FROM scratch
  # (連 /bin/sh 都沒),v1.0.12 用 entrypoint:["/bin/sh","-c"] 在這個 image 上會無限崩潰。
  # 改回原始 command 不套 shell,/srv/RAG 由 tigerai-splitter 啟動時的 mkdir 邏輯產生
  # (splitter 跟 FB 都 mount 同一個 host RAG_FILES_PATH,splitter 容器內看到的 /srv/RAG
  # 就是 host 上的 RAG_FILES_PATH/RAG,FB 容器內也看得到)。用 condition:service_healthy
  # 等 splitter 確實 healthy 才啟 FB,保證 mkdir 已完成。
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${RAG_FILES_PATH:-./data/rag}:/srv
      - filebrowser_db:/database
    command:
      - --noauth
      - --root=/srv/RAG
      - --address=0.0.0.0
      - --port=80
    depends_on:
      tigerai-splitter:
        condition: service_healthy
    networks:
      - stack
    # v1.0.15 2026-05-31: healthcheck via filebrowser /health endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  filebrowser_db:

networks:
  stack:
    external: true
    name: ${STACK_NETWORK:-opengenie-net}
