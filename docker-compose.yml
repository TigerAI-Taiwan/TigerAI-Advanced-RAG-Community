# TigerAI Advanced RAG — Community Edition (image-only distribution)
# Runs the 3 app services on top of an existing OpenGenie AI Stack.
#   STACK_NETWORK         = your OpenGenie Docker network name (external)
#   RAG_FILES_PATH        = host path of the shared RAG files dir (same one FileBrowser/n8n use)
#   TIGERAI_IMAGE_PREFIX  = image registry/namespace (default ghcr.io/tigerai-taiwan)
services:
  tigerai-nginx:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-nginx:latest
    container_name: tigerai-nginx
    ports:
      - "${HOST_UI_PORT:-8088}:80"
    # v2026-05-30: load .env so the upstream HOST/PORT vars (FB_/N8N_/QDRANT_/
    # OWUI_/DOCLING_) reach the nginx:alpine entrypoint, which runs envsubst
    # on /etc/nginx/templates/default.conf.template at boot. Dockerfile sets
    # safe defaults for the OpenGenie default container names — overrides via
    # .env only if your stack uses different names.
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Taipei
    # add nginx worker to gid=1000 group so it can read the RAG files (640/750) written by n8n
    command:
      - sh
      - -c
      # v1.0.10 fix: exec /docker-entrypoint.sh nginx (NOT exec nginx) so the
      # entrypoint's init scripts run — especially 20-envsubst-on-templates.sh
      # which processes /etc/nginx/templates/*.template. Without this, nginx
      # starts with NO config in conf.d/ → all proxy paths return 404 HTML →
      # UI's JSON.parse on /backend/health fails with "unexpected character".
      - 'G=$$(awk -F: ''$$3==1000{print $$1; exit}'' /etc/group); [ -z "$$G" ] && addgroup -g 1000 nginxfiles && G=nginxfiles; addgroup nginx "$$G" 2>/dev/null; exec /docker-entrypoint.sh nginx -g ''daemon off;'''
    volumes:
      # original RAG files (read-only) → /files/ download links in answers
      - ${RAG_FILES_PATH:-./data/rag}:/usr/share/nginx/files:ro
    networks:
      - stack
    depends_on:
      - tigerai-backend
    restart: unless-stopped

  tigerai-backend:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-backend:latest
    container_name: tigerai-backend
    expose:
      - "3060"
    environment:
      - TZ=Asia/Taipei
    env_file:
      - ./.env
    networks:
      - stack
    restart: unless-stopped

  tigerai-splitter:
    image: ${TIGERAI_IMAGE_PREFIX:-ghcr.io/tigerai-taiwan}/tigerai-rag-splitter:latest
    container_name: tigerai-splitter
    environment:
      - TZ=Asia/Taipei
    expose:
      - "8000"
    volumes:
      # MUST point at the same dir as FileBrowser/n8n, or Step0-split files won't be visible
      - ${RAG_FILES_PATH:-./data/rag}:/srv
    # v2026-05-31: auto-create RAG/ self-loop symlink so n8n workflow #01's
    # path `/home/node/.n8n-files/RAG/{folder_id}/...` resolves to the same
    # files FileBrowser writes at `{folder_id}/...`. v1.0.9 priority flip:
    # prefer REAL directory (cleaner, no symlink education cost), fallback to
    # self-loop symlink only if mkdir fails (read-only volume / perms).
    # Skips entirely if /srv/RAG already exists.
    command:
      - sh
      - -c
      - 'if [ ! -e /srv/RAG ]; then mkdir /srv/RAG 2>/dev/null && echo "[startup] created /srv/RAG/ (real dir)" || (ln -s . /srv/RAG && echo "[startup] created /srv/RAG -> . symlink (fallback)"); fi; exec uvicorn main:app --host 0.0.0.0 --port 8000'
    networks:
      - stack
    restart: unless-stopped

  # v1.0.11: 把 FileBrowser bundle 進來(OpenGenie 預設不含,Tab 02 上傳功能必要)。
  # 不加 tigerai- 前綴:這不是我方產品,是 upstream filebrowser/filebrowser image。
  # --noauth 內部 docker network only,對外經 nginx /api/ proxy 走我方 auth。
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${RAG_FILES_PATH:-./data/rag}:/srv
      - filebrowser_db:/database
    command:
      - --noauth
      - --root=/srv
      - --address=0.0.0.0
      - --port=80
    networks:
      - stack
    restart: unless-stopped

volumes:
  filebrowser_db:

networks:
  stack:
    external: true
    name: ${STACK_NETWORK:-opengenie-net}
